function makePerson(){

 addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(e.key.toLowerCase()))e.preventDefault()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
 addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.25))});
 animate();$('status').textContent='Ciudad activa · '+buildings.length+' edificios · '+npcs.length+' NPCs';
}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.045);
 if(mode){let x=joy.x,y=joy.y;if(keys.w||keys.arrowup)y=-1;if(keys.s||keys.arrowdown)y=1;if(keys.a||keys.arrowleft)x=-1;if(keys.d||keys.arrowright)x=1;
  const len=Math.hypot(x,y);if(len>1){x/=len;y/=len}const speed=(running||keys.shift)?9.2:4.8;const dx=(Math.cos(yaw)*x+Math.sin(yaw)*y)*speed*dt,dz=(-Math.sin(yaw)*x+Math.cos(yaw)*y)*speed*dt;movePlayer(dx,dz);
  const moving=Math.hypot(x,y)>.08;if(moving){walkTime+=dt*10;player.userData.legs[0].rotation.x=Math.sin(walkTime)*.62;player.userData.legs[1].rotation.x=-Math.sin(walkTime)*.62;player.userData.arms[0].rotation.x=-Math.sin(walkTime)*.42;player.userData.arms[1].rotation.x=Math.sin(walkTime)*.42}else{for(const part of [...player.userData.legs,...player.userData.arms])part.rotation.x+=(0-part.rotation.x)*Math.min(1,dt*9)}
  player.rotation.y=yaw;const target=new THREE.Vector3(player.position.x-Math.sin(yaw)*8,player.position.y+3.7+pitch*5,player.position.z+Math.cos(yaw)*8);camera.position.lerp(target,1-Math.pow(.001,dt));camera.lookAt(player.position.x,player.position.y+1.45,player.position.z);
 }else controls.update();
 updateNPCs(dt);
 renderer.render(scene,camera);
}
$('mode').onclick=()=>setMode(!mode);
$('cam').onclick=()=>{if(mode)setMode(false);camera.position.set(0,118,150);controls.target.set(0,0,0);controls.update()};
$('run').onclick=()=>{running=!running;$('run').textContent=running?'🏃 CORRER: SÍ':'🏃 CORRER: NO';$('speedLabel').textContent=running?'CORRIENDO':'CAMINANDO'};
$('reset').onclick=()=>{player.position.set(0,0,52);yaw=0;pitch=.12;setMode(true)};
try{init()}catch(err){const box=document.createElement('div');box.style.cssText='position:fixed;z-index:99;inset:12px;background:#260d12;color:white;padding:18px;border-radius:12px;font:14px system-ui;white-space:pre-wrap;height:max-content';box.textContent='ERROR AL INICIAR EL JUEGO\\n'+(err.message||err);document.body.appendChild(box)}
})();
</script>
</body></html>
